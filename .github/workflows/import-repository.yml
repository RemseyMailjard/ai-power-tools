name: Import repository archive

on:
  push:
    branches:
      - ai/import-power-tools-repository
    paths:
      - '.repository-import/ai-power-tools-github-repository.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ai/import-power-tools-repository

      - name: Extract repository contents
        run: |
          unzip -o .repository-import/ai-power-tools-github-repository.zip -d .
          rm -rf .repository-import

      - name: Commit imported repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import AI Power Tools repository contents"
            git push origin HEAD:ai/import-power-tools-repository
          fi
