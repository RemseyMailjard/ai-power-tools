name: Import repository archive

on:
  push:
    branches:
      - ai/import-power-tools-repository
    paths:
      - '.repository-import/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ai/import-power-tools-repository

      - name: Assemble and extract repository
        run: |
          cat .repository-import/archive.part-* > /tmp/repository.zip
          unzip -o /tmp/repository.zip -d .
          rm -rf .repository-import
          rm -f .github/workflows/import-repository.yml

      - name: Commit imported repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import AI Power Tools repository contents"
          git push origin HEAD:ai/import-power-tools-repository
